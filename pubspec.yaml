name: zremote
description: "ZRemote — ZCode 桌面端远程控制伴侣 App：扫码导入，多设备并行会话，生物识别门禁。"
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  mobile_scanner: ^7.4.0
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/brand/mark.png
